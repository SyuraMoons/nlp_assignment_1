# Shared config for the Task 1 pipeline: GDELT acquisition, filtering, scraping,
# cleaning, Bank Indonesia JISDOR exchange rate, and news -> trading-day alignment.

# GCP project used to run BigQuery queries against GDELT's public dataset (billing/
# quota attribution -- the dataset itself is free to query). Must have the BigQuery
# API enabled. Leave blank to fall back to the GOOGLE_CLOUD_PROJECT env var.
gcp_project: "nlpassignment-508617"

date_range:
  start: "2021-09-01"
  end: "2026-09-01"   # Task 1 spec: 1 Sep 2021 - 1 Sep 2026

timezone: "Asia/Jakarta"  # IDR trades in Jakarta; all "daily" aggregation uses WIB calendar days

sites:
  - kontan
  - bisnis
  - cnbc_indonesia

gdelt:
  table: "gdelt-bq.gdeltv2.gkg_partitioned"
  id_domains:
    - "kontan.co.id"
    - "bisnis.com"
    - "cnbcindonesia.com"
  # Global English geopolitical coverage for FinBERT, so the pipeline reflects the
  # hypothesis's "global" scope and not just Indonesian reporting.
  global_sources:
    - "reuters.com"
    - "apnews.com"
    - "bbc.co.uk"
    - "aljazeera.com"
    - "cnbc.com"
    - "theguardian.com"
    - "nytimes.com"
    - "ft.com"
    - "wsj.com"
    - "bloomberg.com"
  global_theme_prefixes:
    - "ARMEDCONFLICT"
    - "SANCTIONS"
    - "MILITARY"
    - "TAX_FNCACT_PRESIDENT"
    - "EPU_"
    - "ECON_TRADE"

# Sections/channels considered macro, market, or international news -- other sections
# (lifestyle, sports, entertainment, ...) are dropped before scraping. Subdomain for
# Kontan, URL path segment after the domain for Bisnis and CNBC Indonesia.
sections:
  kontan:
    - "nasional"
    - "internasional"
    - "keuangan"
    - "investasi"
  bisnis:
    - "ekonomi"
    - "market"
    - "kabar24"
  cnbc_indonesia:
    - "news"
    - "market"
    - "research"

# GDELT GKG theme prefixes considered relevant to geopolitics/macro/FX. This is a
# starting list for the team to review against real filter output (see
# notebooks/01_news_eda.ipynb) and tune -- it is not meant to be final as shipped.
relevant_theme_prefixes:
  - "ECON_"
  - "EPU_"
  - "TAX_FNCACT"
  - "ARMEDCONFLICT"
  - "SANCTIONS"
  - "MILITARY"
  - "TRADE"
  - "CRISISLEX"

# Per site per WIB day, keep at most this many queued articles for full-text scraping
# (headline-level sentiment still covers every filtered row, capped or not -- the cap
# only limits scraping volume/time). Picked deterministically by sorted URL hash so
# reruns select the same articles.
daily_cap_per_site: 15

scraping:
  min_delay_seconds: 1.0
  max_delay_seconds: 3.0
  max_retries: 3
  timeout_seconds: 15
  user_agent: "Mozilla/5.0 (compatible; NLPCourseProjectBot/1.0; contact: harfiibadurrahman@gmail.com)"

paths:
  raw_dir: "data/raw"            # full raw pulls (gitignored; reproducible from src/)
  interim_dir: "data/interim"    # intermediate tables (gitignored)
  processed_dir: "data/processed"
  sample_dir: "data/raw_sample"  # small committed samples of every raw source

# USD/IDR exchange rate: Bank Indonesia's JISDOR reference rate (Task 1 requires
# Bank Indonesia as the source). Downloaded manually as Excel from
# https://www.bi.go.id/id/statistik/informasi-kurs/jisdor/default.aspx
# (BI's site blocks scripted access), saved to data/raw/jisdor/.
fx:
  source: "Bank Indonesia JISDOR"
  raw_file: "data/raw/jisdor/jisdor_raw.xlsx"

# News -> trading-day alignment rule (src/alignment/align_news.py).
# JISDOR is fixed once per Indonesian business day and published at 10:00 WIB.
# A news item is assigned to the FIRST JISDOR fixing that happens at or after it:
#   - published on a trading day at/before the cutoff  -> that same trading day
#   - published after the cutoff                      -> next trading day
#   - published on a weekend / public holiday          -> next trading day
alignment:
  cutoff_time_wib: "10:00"

