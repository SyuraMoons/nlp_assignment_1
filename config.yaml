# Shared config for GDELT acquisition, filtering, scraping, and sentiment scoring.

# GCP project used to run BigQuery queries against GDELT's public dataset (billing/
# quota attribution -- the dataset itself is free to query). Must have the BigQuery
# API enabled. Leave blank to fall back to the GOOGLE_CLOUD_PROJECT env var.
gcp_project: "nlpassignment-508617"

date_range:
  start: "2021-09-01"
  end: "2026-09-14"

timezone: "Asia/Jakarta"  # IDR trades in Jakarta; all "daily" aggregation uses WIB calendar days

sites:
  - kontan
  - bisnis
  - cnbc_indonesia

gdelt:
  table: "gdelt-bq.gdeltv2.gkg_partitioned"
  id_domains:
    - "kontan.co.id"
    - "bisnis.com"
    - "cnbcindonesia.com"
  # Global English geopolitical coverage for FinBERT, so the pipeline reflects the
  # hypothesis's "global" scope and not just Indonesian reporting.
  global_sources:
    - "reuters.com"
    - "apnews.com"
    - "bbc.co.uk"
    - "aljazeera.com"
    - "cnbc.com"
    - "theguardian.com"
    - "nytimes.com"
    - "ft.com"
    - "wsj.com"
    - "bloomberg.com"
  global_theme_prefixes:
    - "ARMEDCONFLICT"
    - "SANCTIONS"
    - "MILITARY"
    - "TAX_FNCACT_PRESIDENT"
    - "EPU_"
    - "ECON_TRADE"

# Sections/channels considered macro, market, or international news -- other sections
# (lifestyle, sports, entertainment, ...) are dropped before scraping. Subdomain for
# Kontan, URL path segment after the domain for Bisnis and CNBC Indonesia.
sections:
  kontan:
    - "nasional"
    - "internasional"
    - "keuangan"
    - "investasi"
  bisnis:
    - "ekonomi"
    - "market"
    - "kabar24"
  cnbc_indonesia:
    - "news"
    - "market"
    - "research"

# GDELT GKG theme prefixes considered relevant to geopolitics/macro/FX. This is a
# starting list for the team to review against real filter output (see
# notebooks/01_news_eda.ipynb) and tune -- it is not meant to be final as shipped.
relevant_theme_prefixes:
  - "ECON_"
  - "EPU_"
  - "TAX_FNCACT"
  - "ARMEDCONFLICT"
  - "SANCTIONS"
  - "MILITARY"
  - "TRADE"
  - "CRISISLEX"

# Per site per WIB day, keep at most this many queued articles for full-text scraping
# (headline-level sentiment still covers every filtered row, capped or not -- the cap
# only limits scraping volume/time). Picked deterministically by sorted URL hash so
# reruns select the same articles.
daily_cap_per_site: 15

scraping:
  min_delay_seconds: 1.0
  max_delay_seconds: 3.0
  max_retries: 3
  timeout_seconds: 15
  user_agent: "Mozilla/5.0 (compatible; NLPCourseProjectBot/1.0; contact: harfiibadurrahman@gmail.com)"

paths:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"

# Person B's Task 1 scope: daily USD/IDR exchange rate, merged with the news
# features table on `date` for the hypothesis test.
fx:
  ticker: "USDIDR=X"
  source: "yfinance"

# Phase 3: named groups within relevant_theme_prefixes, used by
# features/text_features.py to build one daily count column per group (e.g.
# id_theme_armedconflict_count) -- the most direct "geopolitical shock" signal,
# distinct from the general sentiment score.
theme_groups:
  econ: ["ECON_"]
  epu: ["EPU_"]
  trade: ["TRADE", "ECON_TRADE"]
  conflict: ["ARMEDCONFLICT", "MILITARY"]
  sanctions: ["SANCTIONS"]
  crisis: ["CRISISLEX"]
  politics: ["TAX_FNCACT"]

# Phase 3: market-data modality (fx/fetch_market.py). Tickers pulled from Yahoo
# Finance alongside USD/IDR itself -- USD strength/risk-sentiment/commodity proxies
# plus regional-peer FX, so the models have a numeric time-series signal to compare
# news features against. `lag_utc_close` marks tickers whose exchange closes after
# Jakarta's trading day ends, so their same-day close isn't actually known yet at
# WIB close-of-day -- fx/fetch_market.py shifts those series forward one day before
# they're used to predict day t+1 (see README "Phase 3" for the leakage rationale).
market:
  tickers:
    dxy: {symbol: "DX-Y.NYB", lag_utc_close: true}    # US Dollar Index
    brent: {symbol: "BZ=F", lag_utc_close: true}       # Brent crude
    gold: {symbol: "GC=F", lag_utc_close: true}
    vix: {symbol: "^VIX", lag_utc_close: true}
    us10y: {symbol: "^TNX", lag_utc_close: true}
    ihsg: {symbol: "^JKSE", lag_utc_close: false}      # Jakarta Composite, closes in WIB
    usdmyr: {symbol: "USDMYR=X", lag_utc_close: false}
    usdthb: {symbol: "USDTHB=X", lag_utc_close: false}
    usdinr: {symbol: "USDINR=X", lag_utc_close: false}
